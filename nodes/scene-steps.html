<!--
  node-red-contrib-scene-steps — nodes/scene-steps.html
  Node-RED 自定义节点 "scene-steps" 编辑器模板。

  三栏布局（Vue3 零构建，oneditprepare 中动态从 CDN 拉 vue.global.prod.js）：
    左栏：动作分类 + 列表（按 category 分组）
    中栏：步骤列表 + 拖拽排序（HTML5 drag/drop 原生）+ 增删改 + 导入/导出 JSON
    右栏：JSON Schema 表单（按 action.configSchema 渲染 string/number/enum/boolean/object/textarea）
  离线兜底：CDN 加载失败时退化为 textarea 直接编辑 JSON

<script type="text/x-red" data-template-name="scene-steps">
  <!-- Node-RED 默认属性：顶部仅「名称」可见；sceneId 系统级隐藏；

  <div class="nr-ss-top-grid">
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
      <input type="text" id="node-input-name" placeholder="scene-steps">
    </div>
  </div>

  <!-- 高级选项折叠面板（默认收起；非默认值时徽章提示） -->
  <div class="nr-ss-top-adv" id="nr-ss-top-adv">
    <div class="nr-ss-top-adv-header" id="nr-ss-top-adv-toggle">
      <span class="nr-ss-top-adv-arrow">▶</span>
      <span class="nr-ss-top-adv-title">高级选项</span>
      <span class="nr-ss-top-adv-sub">失败策略 / 超时 / 循环上限</span>
      <span class="nr-ss-top-adv-badge" id="nr-ss-top-adv-badge"></span>
    </div>
    <div class="nr-ss-top-adv-body nr-ss-top-grid" style="display:none">
      <div class="form-row">
        <label for="node-input-failBehavior"><i class="fa fa-exclamation-triangle"></i> 失败策略</label>
        <select id="node-input-failBehavior">
          <option value="stop">stop: 中止执行（报错）</option>
          <option value="skip" selected>skip: 跳过当前步</option>
          <option value="retry">retry: 重试 1 次</option>
          <option value="retry:3">retry:3: 重试 3 次</option>
          <option value="retry:5">retry:5: 重试 5 次</option>
        </select>
      </div>
      <div class="form-row">
        <label for="node-input-defaultStepTimeoutMs"><i class="fa fa-clock-o"></i> 默认步骤超时</label>
        <input type="number" id="node-input-defaultStepTimeoutMs" min="50" step="50" placeholder="默认 15000 ms">
      </div>
      <div class="form-row">
        <label for="node-input-maxLoopLimit"><i class="fa fa-repeat"></i> 跳转循环上限</label>
        <input type="number" id="node-input-maxLoopLimit" min="1" step="1" placeholder="默认 1000">
      </div>
    </div>
  </div>

  <input type="hidden" id="node-input-steps">

  </div>

  <style>

<script type="text/x-red" data-help-name="scene-steps">
  <p><b>scene-steps</b>：按先后顺序执行「场景步骤」。适合把"大量延时 + TCP/UDP/HTTP/MQTT 指令串"的中控类工作流收敛在一个节点内编排，不再需要大量"延时节点 + 杂乱连线"。</p>
  <h3>输入 (msg.payload)</h3>
  <ul>
    <li><code>"run"</code> / 省略：执行节点上配置的 steps。</li>
    <li><code>"stop"</code>：取消当前运行中的场景。</li>
    <li><code>"pause"</code> / <code>"resume"</code>：暂停 / 继续。</li>
    <li><code>"debug"</code>：Step 口推送 steps 配置 + 运行状态。</li>
    <li><code>Array</code>：直接作为动态 steps 运行（不使用节点配置）。</li>
  </ul>
  <h3>输出 (4 口)</h3>
  <ol>
    <li><b>step</b>：每一步执行结果（ok/error 都会推）。</li>
    <li><b>done</b>：正常结束或 stop(emitAsDone=true) 的汇总结果。</li>
    <li><b>error</b>：不可恢复错误 (failBehavior=stop 或超时或递归/嵌套超限)。</li>
    <li><b>audit</b>：启停、暂停、取消等审计事件，便于落盘。</li>
  </ol>
  <h3>模板插值</h3>
  <p>所有 string 类参数支持 <code>{{vars.x}}</code>、<code>{{outputs[-1].foo}}</code>、<code>{{env.HOME}}</code>；表达式支持三元、比较、数学运算；显式禁用 eval / Function / process / require 以提升安全性。</p>
  <h3>10 个内置动作</h3>
  <ul>
    <li>流控：delay / label / jump / stop / call_scene / condition_wait</li>
    <li>网络：tcp_send / udp_send / http_request / mqtt_publish（QoS0 only）</li>
  </ul>
</script>

          configSchema: { url:{type:'string',default:'',label:'URL',required:true}, method:{type:'string',enum:['GET','POST','PUT','DELETE','PATCH','HEAD','OPTIONS'],default:'GET',label:'方法'}, headers:{type:'object',default:{},label:'请求头(JSON)'}, body:{type:'string',default:'',label:'请求体',format:'textarea'}, bodyJson:{type:'boolean',default:false,label:'请求体JSON化'}, bodyEncode:{type:'string',enum:['utf8','hex','base64'],default:'utf8',label:'请求体编码'}, timeoutMs:{type:'number',default:15000,label:'超时(ms)'}, followRedirect:{type:'boolean',default:false,label:'跟随重定向'}, redirectLimit:{type:'number',default:5,label:'重定向上限'}, responseParse:{type:'string',enum:['utf8','json','hex','base64','buffer'],default:'utf8',label:'响应解析'} },

          '</div>' +
          '<div class="nr-ss-pane">' +
            '<div class="nr-ss-pane-header"><span>🧾 步骤列表 ({{ state.steps.length }} 步)</span></div>' +
            '<div class="nr-ss-pane-body">' +
              '<div class="nr-ss-tbar">' +
                '<button @click="clearSteps()" class="danger">🗑 清空</button>' +
                '<label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:3px 8px;border:1px solid #d9d9d9;border-radius:3px;background:#fff;font-size:11px;">📥 导入' +
                  '<input type="file" accept="application/json,.json" style="display:none;" @change="(e) => { const f = e.target.files && e.target.files[0]; if (f) importJSON(f); e.target.value = \'\'; }">' +
                '</label>' +
                '<button @click="exportJSON()">📤 导出</button>' +
                '<div style="flex:1;"></div>' +
                '<span v-if="state.status.text" :class="\'nr-ss-msg \' + (state.status.type || \'ok\')" style="padding:2px 8px;margin:0;font-size:11px;">{{ state.status.text }}</span>' +
              '</div>' +
              '<div v-if="state.steps.length === 0" class="nr-ss-step-placeholder">暂无步骤。从左侧拖拽动作到这里，或点击动作上的「+」开始编排。</div>' +
              '<div v-for="(step, idx) in state.steps" :key="step.id || idx" ' +
                'class="nr-ss-step" :class="{ selected: state.selectedIndex === idx, \'drop-before\': state.dragOverIndex === idx && state.dragOverPos === \'before\', \'drop-after\': state.dragOverIndex === idx && state.dragOverPos === \'after\' }" ' +
                'draggable="true" @click="state.selectedIndex = idx" @dragstart="onDragStartStep($event, idx)" @dragend="onDragEndStep" @dragover="onDragOverStep($event, idx)" @drop="onDropStep($event, idx)">' +
                '<span class="nr-ss-step-drag" title="拖拽排序">⋮⋮</span>' +
                '<div class="nr-ss-step-order">{{ idx + 1 }}</div>' +
                '<div class="nr-ss-step-title">' +
                  '<span v-if="step.label" class="nr-ss-step-label">{{ step.label }}</span>' +
                  '<b>{{ (actionsByType.get(step.type) || {}).label || step.type }}</b>' +
                  '<small v-if="(actionsByType.get(step.type) || {}).category">· {{ (actionsByType.get(step.type) || {}).category }}</small>' +
                  '<div style="color:#777;font-size:11px;line-height:1.4;">{{ summarizeStep(step) }}</div>' +
                '</div>' +
                '<button class="nr-ss-step-remove" title="删除" @click.stop="removeStep(idx)">✕</button>' +
              '</div>' +
              '<div class="nr-ss-add-row" style="margin-top:4px;">' +
                '<button>+ 未选择步骤时，点击动作库「+」添加</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="nr-ss-pane">' +
            '<div class="nr-ss-pane-header"><span>🎛 属性配置</span></div>' +
            '<div class="nr-ss-pane-body"><component :is="{ render: renderForm }"></component></div>' +
          '</div>' +
          '</div>'
      });
      app.config.errorHandler = function (err, _vm, _info) {
        try { console.error('[scene-steps editor]', err); } catch (e) {}
        try {
          var box = document.getElementById('nr-scene-steps-err-banner');
          if (!box) {
            box = document.createElement('div');
            box.id = 'nr-scene-steps-err-banner';
            box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#ff4d4f;color:#fff;font:12px/1.5 monospace;padding:6px 10px;white-space:pre-wrap;max-height:40vh;overflow:auto';
            document.body.appendChild(box);
          }
          box.textContent = '编辑器渲染错误: ' + (err && err.message ? err.message : String(err)) + '\n\n' + (err && err.stack ? err.stack : '');
        } catch (e2) {}
      };
      app.mount(mountEl);
    }

    // ============================
    //  Fallback textarea (CDN 加载失败 / 离线)
    // ============================
    function mountFallbackEditor(mountEl, initialSteps, onChange) {
      mountEl.innerHTML =
        '<div style="padding:10px;">' +
        '<h4 style="margin:0 0 8px 0;">Vue3 CDN 未加载（离线或 CSP 限制）</h4>' +
        '<p style="color:#888;margin:0 0 8px 0;">请以 JSON 方式直接编辑 steps 数组（schema 同运行时 steps）。</p>' +
        '<textarea id="nr-ss-fallback-textarea" wrap="off" spellcheck="false" style="width:100%;height:440px;font-family:Consolas,Menlo,monospace;font-size:12px;border:1px solid #d9d9d9;border-radius:3px;padding:6px;"></textarea>' +
        '<p id="nr-ss-fallback-status" style="color:#999;margin-top:6px;font-size:11px;">JSON 格式正确：已解析 ✔</p></div>';
      var ta = mountEl.querySelector('#nr-ss-fallback-textarea');
      var st = mountEl.querySelector('#nr-ss-fallback-status');
      ta.value = JSON.stringify(Array.isArray(initialSteps) && initialSteps.length ? initialSteps : [], null, 2);
      var debounce = null;
      ta.addEventListener('input', function () {
        if (debounce) clearTimeout(debounce);
        debounce = setTimeout(function () {
          try {
            var arr = JSON.parse(ta.value);
            if (!Array.isArray(arr)) throw new Error('不是数组');
            ta.style.borderColor = '#b7eb8f';
            st.textContent = 'JSON 格式正确：已解析 ✔ (' + arr.length + ' 步)';
            st.style.color = '#52c41a';
            onChange(arr);
          } catch (e) {
            ta.style.borderColor = '#ffccc7';
            st.textContent = 'JSON 格式错误：' + e.message;
            st.style.color = '#ff4d4f';
          }
        }, 150);
      });
    }

    // ============================
    //  Node-RED 节点注册
    // ============================
    RED.nodes.registerType('scene-steps', {
      category: 'function',
      color: '#8db4dd',
      defaults: {
        name: { value: '' },
        sceneId: { value: '', required: false },
        failBehavior: { value: 'skip', required: true },
        maxLoopLimit: { value: 1000, required: true, validate: RED.validators.number() },
        defaultStepTimeoutMs: { value: 15000, required: true, validate: RED.validators.number() },
        steps: { value: [], required: false }
      },
      inputs: 1,
      outputs: 4,
      outputLabels: ['step', 'done', 'error', 'audit'],
      icon: 'font-awesome/fa-list-ol.svg',
      label: function () { return this.name || 'scene-steps'; },
      paletteLabel: 'scene-steps',
      align: 'left',
      oneditprepare: function () {
        var node = this;
        var $steps = $('#node-input-steps');
        var currentSteps = ensureJSON(node.steps || []);
        try { $steps.val(JSON.stringify(currentSteps)); } catch (e) { $steps.val('[]'); }

        // sceneId 为空时自动生成；编辑器顶部不再暴露 sceneId 输入框或生成按钮，
        // sceneId 一旦首次保存即稳定，防止误改导致 call_scene 引用断链
        if (!node.sceneId) {
          node.sceneId = 'scene_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
        }

        // 收集所有已部署的 scene-steps 节点（除自己外）的 sceneId+name，
        // 用于 call_scene(ref_scene 模式) 下拉选择
        var sceneList = [];
        try {
          if (RED && RED.nodes && typeof RED.nodes.eachNode === 'function') {
            RED.nodes.eachNode(function (n) {
              if (n && n.type === 'scene-steps' && n.id !== node.id) {
                sceneList.push({
                  sceneId: n.sceneId || '',
                  name: n.name || n.id,
                  nodeId: n.id
                });
              }
            });
          }
        } catch (e) { /* ignore */ }
        // 自身也加入（编辑期预览用，但运行时调用自身会被循环检测拦截）
        sceneList.unshift({ sceneId: node.sceneId, name: (node.name || '本场景'), nodeId: node.id, isSelf: true });

        // 编辑器尺寸记忆：优先级 localStorage > 视口 92%；记忆宽 > 视口宽时回退 92% 并更新
        try {
          var vw = window.innerWidth, vh = window.innerHeight;
          var saved = loadEditorSize();
          var targetW, targetH;
          if (saved && saved.width > 0 && saved.height > 0) {
            targetW = saved.width; targetH = saved.height;
            if (targetW > vw) { // 切到更小屏幕：回退 92% 并更新记忆
              targetW = Math.round(vw * 0.92);
              targetH = Math.max(600, vh - 120);
              saveEditorSize(targetW, targetH);
            }
          } else {
            targetW = Math.round(vw * 0.92);
            targetH = Math.max(600, vh - 120);
          }
          applyEditorSize(targetW, targetH);
        } catch (e) { /* ignore resize errors */ }
        editorSizeReady = true; // 允许后续 oneditresize 写入记忆

        function persist(nextSteps) {
          currentSteps = ensureJSON(nextSteps);
          $steps.val(JSON.stringify(currentSteps));
        }

        var mountEl = document.querySelector('#nr-scene-steps-vue-mount');
        if (!mountEl) return;
        // 先尝试元数据加载（离线下也能拿到 DEFAULT_META 兜底）
        fetchMeta(function (_err, meta) {
          var metaObj = meta || JSON.parse(JSON.stringify(DEFAULT_META));
          // 把场景列表注入到 metaObj，供 call_scene ref_scene 模式下拉使用
          metaObj.sceneList = sceneList;
          // 尝试 Vue CDN；5s 后失败就兜底
          var timeoutId = setTimeout(function () {
            if (!window.Vue) mountFallbackEditor(mountEl, currentSteps, persist);
          }, 5000);
          ensureVueCDN(function (err, Vue) {
            clearTimeout(timeoutId);
            if (err || !Vue) { mountFallbackEditor(mountEl, currentSteps, persist); return; }
            mountVueEditor(Vue, mountEl, metaObj, currentSteps, persist);
          });
        });

        // 「高级选项」折叠面板：toggle 展开/收起 + 「已自定义 N」徽章
        // 默认 baseline: failBehavior=skip / defaultStepTimeoutMs=15000 / maxLoopLimit=1000
        var topAdvOpen = false;
        function updateTopAdvBadge() {
          var fb = $('#node-input-failBehavior').val();
          var to = parseInt($('#node-input-defaultStepTimeoutMs').val(), 10);
          var ml = parseInt($('#node-input-maxLoopLimit').val(), 10);
          var n = 0;
          if (fb && fb !== 'skip') n++;
          if (!isNaN(to) && to !== 15000) n++;
          if (!isNaN(ml) && ml !== 1000) n++;
          var $b = $('#nr-ss-top-adv-badge');
          if (!$b.length) return;
          if (n > 0) { $b.text('已自定义 ' + n).css('display', 'inline-block'); }
          else { $b.hide(); }
        }
        $('#nr-ss-top-adv-toggle').off('click.topadv').on('click.topadv', function () {
          topAdvOpen = !topAdvOpen;
          $('.nr-ss-top-adv-body').slideToggle(120);
          $('.nr-ss-top-adv-arrow').text(topAdvOpen ? '▼' : '▶');
          $('.nr-ss-top-adv').toggleClass('expanded', topAdvOpen);
          updateTopAdvBadge();
        });
        $('#node-input-failBehavior,#node-input-defaultStepTimeoutMs,#node-input-maxLoopLimit')
          .off('change.topadv').on('change.topadv', updateTopAdvBadge);
        updateTopAdvBadge(); // 初始
      },
      oneditsave: function () {
        var $steps = $('#node-input-steps');
        var v = $steps.val();
        if (typeof v === 'string' && v.trim()) {
          try { var arr = JSON.parse(v); if (Array.isArray(arr)) { this.steps = arr; return; } } catch (e) {}
        }
        var ta = document.querySelector('#nr-ss-fallback-textarea');
        if (ta) {
          try { var arr2 = JSON.parse(ta.value); if (Array.isArray(arr2)) { this.steps = arr2; return; } } catch (e) {}
        }
        this.steps = [];
      },
      oneditcancel: function () { /* noop */ },
      oneditresize: function (size) {
        var box = document.querySelector('#nr-scene-steps-root');
        if (box && size && size.height) {
          // 动态测算顶部可见 DOM 实际高度（名称栅格 + 高级选项折叠面板 header 或 body），
          // 不再写死 260；折叠展开/收起均能正确撑满
          var topH = 220;
          try {
            var g = $('.nr-ss-top-grid').first();
            var adv = $('.nr-ss-top-adv:visible').first();
            var gh = g.length ? (g.outerHeight(true) || 0) : 0;
            var ah = adv.length ? (adv.outerHeight(true) || 0) : 0;
            if (gh + ah > 0) topH = gh + ah + 60;
          } catch (e) { topH = 220; }
          box.style.height = Math.max(360, size.height - topH) + 'px';
        }
        // 防抖 300ms 写入 localStorage（跳过初始展示期回调，避免覆盖记忆值）
        if (editorSizeReady && size && size.width) {
          var sw = size.width;
          var sh = size.height;
          if (!sh) { // 宽度拖拽时 height 缺失，沿用当前 tray 可视高度
            var trayEl = box ? box.closest('.red-ui-tray') : null;
            sh = trayEl ? trayEl.offsetHeight : 0;
          }
          if (!sh) sh = Math.max(600, window.innerHeight - 120);
          if (editorSizeSaveTimer) clearTimeout(editorSizeSaveTimer);
          editorSizeSaveTimer = setTimeout(function () { saveEditorSize(sw, sh); }, 300);
        }
      }
    });
  })();
</script>
